spring.application.name=auth-jwt-demo
server.port=${PORT:8080}

# Base de datos: en local usa los valores por defecto (root/root/localhost).
# En Render, configura las variables DB_URL, DB_USERNAME, DB_PASSWORD
# para que apunten a Aiven, sin tocar este archivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservasdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Google OAuth: en local usa los placeholders actuales.
# En Render, configura GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:TU_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:TU_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Mercado Pago: en local usa el token de prueba actual.
# En Render, configura MERCADOPAGO_ACCESS_TOKEN.
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:TEST-320296471233317-081122-b4ad40583bb1564c09da42049eb68675-1169757677}

spring.main.allow-bean-definition-overriding=true
spring.jackson.serialization.fail-on-empty-beans=false